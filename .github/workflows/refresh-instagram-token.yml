name: Refresh Instagram Token

on:
  schedule:
    - cron: "0 8 1 * *" # 1er de chaque mois à 8h UTC
  workflow_dispatch: # déclenchement manuel possible

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # The refresh and the secret write happen in one step on purpose: a step
      # output would carry the token across a step boundary, and any inline
      # ${{ }} interpolation of it gets echoed verbatim into the run log.
      - name: Refresh token and update secret
        id: refresh
        env:
          IG_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_SECRETS_WRITE }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS \
            "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_TOKEN}")

          NEW_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')

          if [ -z "$NEW_TOKEN" ]; then
            # Print only the error message, never the raw response — it can
            # echo back the token that was sent.
            MSG=$(echo "$RESPONSE" | jq -r '.error.message // "réponse inattendue"')
            echo "::error::Refresh échoué — $MSG"
            case "$MSG" in
              *"not authorized"*|*"Session has been invalidated"*)
                echo "::error::L'application Instagram n'est plus autorisée. Il faut ré-autoriser le compte dans Meta for Developers puis régénérer un token — un refresh ne suffit pas."
                ;;
            esac
            exit 1
          fi

          # Mask before the value can reach any log line.
          echo "::add-mask::$NEW_TOKEN"

          EXPIRES_IN=$(echo "$RESPONSE" | jq -r '.expires_in // 0')
          echo "expires_days=$((EXPIRES_IN / 86400))" >> "$GITHUB_OUTPUT"

          # Confirm the new token actually works before persisting it, so a
          # revoked authorisation fails here rather than silently one day later.
          CHECK=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://graph.instagram.com/v21.0/me?fields=id&access_token=${NEW_TOKEN}")
          if [ "$CHECK" != "200" ]; then
            echo "::error::Le nouveau token est refusé par l'API (HTTP $CHECK) — secret non mis à jour."
            exit 1
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PAT_SECRETS_WRITE absent — le secret n'a pas pu être mis à jour."
            exit 1
          fi

          # gh secret set reads the value from stdin when --body is omitted,
          # which keeps the token out of argv and off the disk.
          printf '%s' "$NEW_TOKEN" | gh secret set INSTAGRAM_ACCESS_TOKEN --repo "$REPO"

          echo "✅ Token renouvelé et secret mis à jour."

      - name: Summary
        if: always()
        run: |
          {
            echo "## Refresh Instagram Token"
            echo ""
            echo "- **Date** : $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- **Résultat** : ${{ steps.refresh.outcome }}"
            echo "- **Expire dans** : ${{ steps.refresh.outputs.expires_days || 'n/a' }} jours"
          } >> "$GITHUB_STEP_SUMMARY"
